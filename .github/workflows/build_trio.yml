name: 4. Build Trio
run-name: Build Trio (${{ github.ref_name }})
on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build Trio Unsigned
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer"

      - name: Checkout Repo for building
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      - name: Fix ##TEAM_ID## and Bundle Identifiers for Watch & iPhone
        run: |
          # Remplace le fameux ##TEAM_ID## qui causait l'erreur 3010 et le blocage Watch
          find . -type f \( -name "*.xcconfig" -o -name "project.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/org\.nightscout\.##TEAM_ID##\.trio/org.mevenroy.trio.724Q9HY738/g' {} +
          find . -type f \( -name "*.xcconfig" -o -name "project.pbxproj" -o -name "*.plist" \) -exec sed -i '' 's/##TEAM_ID##/724Q9HY738/g' {} +

      - name: Customize Trio
        run: |
          if ls ./patches/* 1> /dev/null 2>&1; then
            git apply ./patches/* --allow-empty -v --whitespace=fix || true
          fi

      - name: Install Dependencies
        run: bundle install

      - name: Restore Xcode DerivedData Cache
        uses: actions/cache@v4
        with:
          path: build_output
          key: ${{ runner.os }}-trio-build-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-trio-build-${{ github.ref_name }}-
            ${{ runner.os }}-trio-build-

      - name: Build Trio Workspace
        run: |
          xcodebuild build \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_output \
            -jobs $(sysctl -n hw.logicalcpu) \
            ARCHS=arm64 \
            DEBUG_INFORMATION_FORMAT=dwarf \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for Sideloadly & AltStore
        run: |
          mkdir -p artifacts/Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          cp -R "$APP_PATH" artifacts/Payload/Trio.app

          # Vérification finale que la Watch pointe bien vers org.mevenroy.trio.724Q9HY738
          if [ -d "artifacts/Payload/Trio.app/Watch" ]; then
            for watch_app in artifacts/Payload/Trio.app/Watch/*.app; do
              /usr/libexec/PlistBuddy -c "Set :WKCompanionAppBundleIdentifier org.mevenroy.trio.724Q9HY738" "$watch_app/Info.plist" || true
            done
          fi

          cd artifacts
          zip -qry Trio.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trio-IPA
          path: artifacts/Trio.ipa
          retention-days: 7
