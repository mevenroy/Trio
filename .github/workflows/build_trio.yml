name: 4. Build Trio
run-name: Build Trio (${{ github.ref_name }})
on:
  workflow_dispatch:

env:
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  build:
    name: Build Trio Unsigned
    runs-on: macos-26
    permissions:
      contents: read
    steps:
      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_26.5.app/Contents/Developer"

      - name: Checkout Repo for building
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          submodules: recursive
          ref: ${{ env.TARGET_BRANCH }}

      - name: Patch Bundle Identifier
        run: |
          # Remplace le bundle id officiel par un identifiant personnel dans tous les fichiers de configuration
          find . -type f \( -name "*.xcconfig" -o -name "project.pbxproj" \) -exec sed -i '' 's/org\.nightscout\.Trio/org.mevenroy.trio/g' {} +
          find . -type f \( -name "*.xcconfig" -o -name "project.pbxproj" \) -exec sed -i '' 's/org\.nightscout\.iAPS/org.mevenroy.trio/g' {} +

      - name: Customize Trio
        run: |
          if ls ./patches/* 1> /dev/null 2>&1; then
            git apply ./patches/* --allow-empty -v --whitespace=fix || true
          fi

      - name: Install Dependencies
        run: bundle install

      - name: Build Trio Workspace
        run: |
          xcodebuild build \
            -workspace Trio.xcworkspace \
            -scheme Trio \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_output \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package IPA for AltStore
        run: |
          mkdir -p artifacts/Payload
          APP_PATH=$(find build_output/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : application .app introuvable"
            exit 1
          fi
          echo "Application trouvée : $APP_PATH"
          cp -R "$APP_PATH" artifacts/Payload/
          cd artifacts
          zip -qry Trio.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Trio-IPA
          path: artifacts/Trio.ipa
          retention-days: 7
